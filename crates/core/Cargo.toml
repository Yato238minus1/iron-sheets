[package]
name = "iron-sheets-core"
description = "GUI-free core of iron sheets: workspaces, text IO, file tree, index, links, fuzzy matching, search, file watching"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Classifies `.excalidraw` / `.excalidraw.md` files as drawings; off: they are plain other files / Markdown notes.
excalidraw = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
rayon = { workspace = true }
memchr = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }
toml = { workspace = true }
directories = "6"
notify = "8.2"
trash = "5.3"

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }

[[bench]]
name = "core_bench"
harness = false
