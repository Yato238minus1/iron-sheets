[package]
name = "iron-sheets-md"
description = "GUI-free Markdown layer of iron sheets: comrak -> flat block model, editor highlighter, editing helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Obsidian Kanban board model (`kanban`).
kanban = []
# Excalidraw parser and SVG renderer (`excalidraw`).
excalidraw = ["dep:serde", "dep:serde_json"]

[dependencies]
comrak = { version = "0.59", default-features = false, features = ["shortcodes"] }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
memchr = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "md_bench"
harness = false
