[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Shared dependency versions. Keep these aligned with what `typst` 0.15 already
# pulls in (tiny-skia 0.12, resvg/usvg 0.47, fontdb 0.23, syntect 5 + two-face 0.4)
# so nothing gets compiled twice.
[workspace.dependencies]
iron-sheets-core = { path = "crates/core" }
iron-sheets-md = { path = "crates/md" }
iron-sheets-symrec = { path = "crates/symrec" }
iron-sheets-typst = { path = "crates/typst-engine", default-features = false }
iron-sheets-app-core = { path = "crates/app-core" }
iron-sheets-ui-egui = { path = "crates/ui-egui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1.12"
memchr = "2.8"
rustc-hash = "2.1"
smallvec = "1.16"
# Same major as typst-syntax (0.8), parse only.
toml = { version = "0.8", default-features = false, features = ["parse"] }
ttf-parser = "0.25"
tiny-skia = "0.12"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Day-to-day builds: our crates lightly optimised, dependencies selectively optimised
# (`opt-level = 1` baseline, `3` for runtime-hot text/render/Typst crates, `0` for heavy non-hot/proc-macro crates).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Proc-macros and build.rs helpers (syn 2/3, zbus_macros, typst-macros, serde_derive):
[profile.dev.build-override]
opt-level = 0

# Safe fast baseline for dependencies (avoids -O3 LLVM passes on ~650 crates):
[profile.dev.package."*"]
opt-level = 1
debug = false

