# Distribution build. Fat LTO + one codegen unit: 85.6 -> 66.3 MB, startup and Typst compiles unchanged.
# Not used: opt-level "z" for dependencies (55.4 MB, but Typst compiles 30-50% slower) and
# panic = "abort" (Typst, comrak and font scanning run under catch_unwind).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

